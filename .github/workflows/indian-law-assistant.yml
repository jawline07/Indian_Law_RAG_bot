name: Indian Law RAG Assistant

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'OpenAI Model to use'
        required: false
        default: 'gpt-3.5-turbo'
      environment:
        description: 'Environment'
        required: false
        default: 'production'

jobs:
  run-indian-law-assistant:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify project structure
      run: |
        echo "Checking project files..."
        ls -la
        echo "Checking law documents..."
        ls -la "law documents/"
    
    - name: Create environment file
      run: |
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env
        echo ".env file created successfully"
    
    - name: Validate JSON documents
      run: |
        echo "Validating JSON files..."
        python -c "
        import json
        files = ['law documents/constitution_qa.json', 'law documents/ipc_qa.json', 'law documents/crpc_qa.json']
        for f in files:
            with open(f) as file:
                data = json.load(file)
                print(f'{f}: {len(data)} Q&A pairs')
        "
    
    - name: Run Indian Law Assistant
      run: |
        streamlit run Indian_law.py \
          --logger.level=debug \
          --client.showErrorDetails=true
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        STREAMLIT_SERVER_HEADLESS: true
        STREAMLIT_SERVER_PORT: 8501
        STREAMLIT_SERVER_RUNONCESAVE: false
